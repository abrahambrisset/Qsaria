name: Qsaria Claude Plugin

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".claude/settings.json"
      - "plugins/qsaria-claude-code/**"
      - "plugins/qsaria-codex/contracts/**"
      - "src/cs_copilot/mcp/qsaria/**"
      - "src/cs_copilot/mcp/tool_specs/qsaria*.py"
      - "src/cs_copilot/mcp/server.py"
      - "src/cs_copilot/mcp/tools_registry.py"
      - "tests/unit/test_qsaria_claude_bundle.py"
      - "tests/unit/mcp/qsaria/**"
      - "tests/unit/mcp/test_server_build.py"
      - ".github/workflows/claude-plugin.yml"
      - ".github/ISSUE_TEMPLATE/qsaria_claude_code_bug.yml"
  pull_request:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - ".claude/settings.json"
      - "plugins/qsaria-claude-code/**"
      - "plugins/qsaria-codex/contracts/**"
      - "src/cs_copilot/mcp/qsaria/**"
      - "src/cs_copilot/mcp/tool_specs/qsaria*.py"
      - "src/cs_copilot/mcp/server.py"
      - "src/cs_copilot/mcp/tools_registry.py"
      - "tests/unit/test_qsaria_claude_bundle.py"
      - "tests/unit/mcp/qsaria/**"
      - "tests/unit/mcp/test_server_build.py"
      - ".github/workflows/claude-plugin.yml"
      - ".github/ISSUE_TEMPLATE/qsaria_claude_code_bug.yml"

jobs:
  static-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install project dependencies
        run: uv sync --extra mcp

      - name: Check Claude plugin Python formatting
        run: >-
          uv run black --check
          plugins/qsaria-claude-code/scripts/
          tests/unit/test_qsaria_claude_bundle.py

      - name: Lint Claude plugin checks
        run: >-
          uv run ruff check
          plugins/qsaria-claude-code/scripts/
          tests/unit/test_qsaria_claude_bundle.py

      - name: Validate the static Claude bundle
        run: |
          uv run python plugins/qsaria-claude-code/scripts/preflight.py
          uv run python plugins/qsaria-claude-code/scripts/validate_claude_bundle.py
          uv run python plugins/qsaria-claude-code/scripts/validate_shared_runtime.py
          uv run python plugins/qsaria-claude-code/scripts/sync_qsaria_claude.py --check
          uv run python plugins/qsaria-claude-code/scripts/smoke_claude_plugin.py

      - name: Run Claude bundle unit tests
        run: uv run pytest tests/unit/test_qsaria_claude_bundle.py -v --tb=short
