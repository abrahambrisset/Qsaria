name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run black --check src/ tests/

      - name: Run linter
        run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: uv sync --extra mcp --extra prediction

      - name: Validate Qsaria Codex distribution
        run: |
          python plugins/qsaria-codex/scripts/preflight.py
          python plugins/qsaria-codex/scripts/install_project_agents.py --check
          python plugins/qsaria-codex/scripts/validate_bundle.py
          python plugins/qsaria-codex/scripts/smoke_codex_plugin.py

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
        env:
          USE_S3: "false"
          CS_COPILOT_STORAGE_ROOT: "data"

      - name: Run offline Qsaria reference workflows
        run: |
          mkdir -p "$CS_COPILOT_STORAGE_ROOT" "$HF_HOME" "$MPLCONFIGDIR" "$TMPDIR" "$XDG_CACHE_HOME"
          uv run --no-sync python -m pytest -q -o cache_dir=.files/publication/agentic-ci/pytest-cache tests/integration/test_qsaria_v1_mcp_workflow.py
          uv run --no-sync python -m scripts.check_qsaria_v1_chainlit
        env:
          USE_S3: "false"
          CS_COPILOT_STORAGE_ROOT: ${{ github.workspace }}/.files/publication/agentic-ci-chainlit/storage
          HF_HOME: ${{ github.workspace }}/.files/publication/agentic-ci-chainlit/models
          MPLCONFIGDIR: ${{ github.workspace }}/.files/publication/agentic-ci-chainlit/mpl
          TMPDIR: ${{ github.workspace }}/.files/publication/agentic-ci-chainlit/tmp
          XDG_CACHE_HOME: ${{ github.workspace }}/.files/publication/agentic-ci-chainlit/cache
          AGNO_TELEMETRY: "false"
          HF_HUB_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          MPLBACKEND: Agg
          OMP_NUM_THREADS: "1"
          OMP_THREAD_LIMIT: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          CS_COPILOT_DISABLE_PROCESS_POOLS: "1"
